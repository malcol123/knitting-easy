<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Knitting Easy</title>
  <meta name="description" content="Knitting Easy: contagiri per lavori a maglia con i ferri, con schema che si colora man mano.">
  <meta name="theme-color" content="#faf6f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Knitting Easy">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // tema applicato subito, per evitare lampi di colore all'avvio
    try {
      var d = JSON.parse(localStorage.getItem('contagiri-maglia:v1') || '{}');
      var t = (d.settings && d.settings.theme) || 'auto';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" aria-live="off"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript><p style="padding:24px">Per usare il contagiri è necessario attivare JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
